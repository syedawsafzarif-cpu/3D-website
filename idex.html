<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Syed Awsaf Zarif | 3D Portfolio</title>

<link rel="stylesheet" href="style.css">


<!-- Icons -->
<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<!-- Loading Screen -->

<div id="loader">

    <div class="cube"></div>

    <h2>Loading...</h2>

</div>



<!-- Animated Background -->

<div class="particles"></div>



<!-- Dark / Light Mode Button -->

<button id="theme">

<i class="fa-solid fa-moon"></i>

</button>




<div class="container">


<div class="card">



<!-- Status -->

<div class="status">

<span></span> Online

</div>




<!-- PROFILE IMAGE -->

<!-- Replace profile.png with your image name -->

<img 
src="profile.png"
class="profile"
alt="Profile Picture">





<!-- Name Typing Animation -->

<h1>

<span id="typing"></span>

</h1>




<p>
Welcome! Connect with me online.
</p>





<!-- Stats -->

<div class="stats">


<div>

<h2 id="visitors">
0
</h2>

<p>
Visitors
</p>

</div>



<div>

<h2>
99%
</h2>

<p>
Energy
</p>

</div>



</div>







<!-- Social Buttons -->

<div class="buttons">



<!-- Replace # with your real links -->


<a href="#" class="btn instagram">

<i class="fa-brands fa-instagram"></i>

Instagram

</a>




<a href="#" class="btn linkedin">

<i class="fa-brands fa-linkedin"></i>

LinkedIn

</a>




<a href="#" class="btn discord">

<i class="fa-brands fa-discord"></i>

Discord

</a>




<a href="#" class="btn">

<i class="fa-solid fa-gamepad"></i>

Roblox

</a>



</div>







<!-- Music Button -->


<button id="music">

<i class="fa-solid fa-music"></i>

Play Music

</button>




<!-- MUSIC FILE -->

<!-- Put your music file in the folder -->

<audio id="song">

<source src="music.mp3" type="audio/mp3">

</audio>






</div>

</div>







<script src="script.js"></script>


</body>

</html>
